name: repository-validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check yamllint
      - name: Validate YAML syntax
        run: yamllint -c .yamllint platform .github/workflows
      - name: Validate shell syntax
        run: bash -n scripts/*.sh pipelines/*.sh
